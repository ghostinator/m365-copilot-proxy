name: Publish to npm

on:
  release:
    types: [published]

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: node scripts/test-installed-runtime.mjs

      - run: node scripts/build-release.mjs

      - run: node scripts/verify-release.mjs "$(find release -mindepth 1 -maxdepth 1 -type d | head -1)"

      - run: pnpm -r publish --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: runtime-*
          merge-multiple: true
          path: release-artifacts
      - run: gh release upload "$GITHUB_REF_NAME" release-artifacts/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
